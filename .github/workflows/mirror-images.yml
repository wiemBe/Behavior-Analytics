name: Mirror images

# After the repository rename (2026-10-18) releases are pushed to
# ghcr.io/wiembe/behavior-analytics/<service>. This copies the images of earlier releases from
# the old name, so an old version can still be pulled under the new one (for example the
# same-version install re-run after a rollback). Run it by hand once per release it must carry.
# The copy is a manifest copy: it keeps the digest, and the job fails when source and target differ.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space separated tags to copy (plain SemVer). Required; these are historical releases, not VERSION."
        required: true

# The single job pushes images and reads nothing from the repository (it has no
# checkout step), so it gets the one write scope it uses.
permissions:
  packages: write

env:
  SOURCE_PREFIX: ghcr.io/wiembe/qradar-dashboard

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      TAGS: ${{ inputs.tags }}
    steps:
      - name: Source and target differ
        run: |
          target="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$target" = "$SOURCE_PREFIX" ]; then
            echo "source and target prefix are the same ($target); nothing to copy" >&2
            exit 1
          fi
          echo "TARGET_PREFIX=$target" >> "$GITHUB_ENV"

      - name: The tags are plain versions
        run: |
          [ -n "${TAGS// /}" ] || { echo "no tag given" >&2; exit 1; }
          for tag in $TAGS; do
            [[ $tag =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "not a plain SemVer tag: $tag" >&2; exit 1; }
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy each image and compare digests
        run: |
          for tag in $TAGS; do
            for service in backend frontend postgres qradar-mcp proxy; do
              src="$SOURCE_PREFIX/$service:$tag"
              dst="$TARGET_PREFIX/$service:$tag"
              docker buildx imagetools create --tag "$dst" "$src"
              src_digest="$(docker buildx imagetools inspect "$src" --format '{{.Manifest.Digest}}')"
              dst_digest="$(docker buildx imagetools inspect "$dst" --format '{{.Manifest.Digest}}')"
              if [ -z "$src_digest" ] || [ "$src_digest" != "$dst_digest" ]; then
                echo "digest differs for $service:$tag (source '$src_digest', target '$dst_digest')" >&2
                exit 1
              fi
              echo "$dst $dst_digest"
            done
          done
