name: Release

# A tag `v<VERSION>` builds, checks and publishes the five images of
# docs/OPERATIONS-DESIGN.md section 2.2, then writes the GitHub Release.
# Nothing is pushed until the version checks and the CI gates have passed.
on:
  push:
    tags: ["v*"]

# Read-only by default. Only the jobs that push images or write the release get
# a write token at job level (`images`, `release`).
permissions:
  contents: read

env:
  # The vendored IBM qradar-mcp commit. A pin bump is a reviewed edit of this one line.
  QRADAR_MCP_PIN: b8f6a4a3fe901eac4f55e4ca5d146d952f55db51

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: qradar-mcp is at the pinned commit
        run: |
          git submodule status
          line="$(git submodule status -- qradar-mcp)"
          # The first character is the state: ' ' is checked out at the recorded commit.
          [ "${line:0:1}" = " " ] || { echo "qradar-mcp is not at its recorded commit: $line" >&2; exit 1; }
          sha="$(echo "${line:1}" | cut -d' ' -f1)"
          [ "$sha" = "$QRADAR_MCP_PIN" ] || { echo "qradar-mcp is $sha, expected $QRADAR_MCP_PIN" >&2; exit 1; }

      - name: The tag, VERSION and the release notes agree
        id: version
        run: |
          version="$(cat VERSION)"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME is not v$version (VERSION)" >&2; exit 1; }
          notes="docs/releases/$version.md"
          [ -f "$notes" ] || { echo "$notes does not exist" >&2; exit 1; }
          front="$(awk 'NR==1 && $0!="---" {exit} NR>1 && $0=="---" {exit} NR>1 {print}' "$notes")"
          echo "$front" | grep -qx "version: $version" || { echo "$notes front matter lacks 'version: $version'" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  gates:
    needs: verify
    uses: ./.github/workflows/ci.yml

  images:
    needs: [verify, gates]
    # This job pushes to ghcr.io; it is the only one that needs packages: write.
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: backend
            # VERSION and docs/releases/ sit outside backend/; the Dockerfile reads them
            # from the named context `repo`.
            build-contexts: repo=.
            base-label: ""
          - name: frontend
            context: frontend
            build-contexts: ""
            base-label: ""
          - name: postgres
            context: deploy/postgres
            build-contexts: ""
            base-label: timescale/timescaledb:2.17.2-pg16
          - name: qradar-mcp
            # deploy/mcp/Dockerfile is FROM the named context `upstream`: IBM's qradar-mcp
            # built with its own Dockerfile (step "Build the upstream qradar-mcp") plus
            # one COPY of feature_toggles.json (writes off). Nothing else is changed.
            context: deploy/mcp
            # A template: github.workspace is empty while a matrix expands, so the step
            # fills in {0} with format() (REL-1; v0.1.5 failed on "/.qradar-mcp-upstream").
            build-contexts: upstream=oci-layout://{0}/.qradar-mcp-upstream
            base-label: ""
          - name: proxy
            context: deploy/proxy
            build-contexts: ""
            base-label: nginx:1.27-alpine
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Image names and tags
        id: names
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "image=$prefix/${{ matrix.name }}"
            echo "tags<<EOF"
            echo "$prefix/${{ matrix.name }}:$VERSION"
            echo "$prefix/${{ matrix.name }}:sha-${GITHUB_SHA::12}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Labels
        id: labels
        run: |
          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.version=$VERSION"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "org.opencontainers.image.licenses=Apache-2.0"
            if [ "${{ matrix.name }}" = "postgres" ] || [ "${{ matrix.name }}" = "proxy" ]; then
              echo "org.opencontainers.image.base.name=${{ matrix.base-label }}"
            fi
            if [ "${{ matrix.name }}" = "qradar-mcp" ]; then
              echo "dev.qradar-dash.qradar-mcp.pin=$QRADAR_MCP_PIN"
              # Overriding the Dockerfile's IBM maintainer label: docker/build-push-action passes
              # this step's labels: lines to buildx as --label flags, and a --label value wins
              # over the image's own LABEL for the same key. This image is built from IBM's
              # unchanged qradar-mcp and must not read as an IBM release.
              echo "org.opencontainers.image.title=qradar-mcp"
              echo "org.opencontainers.image.description=IBM/qradar-mcp at commit $QRADAR_MCP_PIN, unmodified, with feature_toggles.json replaced (writes off). Apache-2.0. Not an IBM release."
              echo "maintainer=Behavior Analytics release workflow (IBM/qradar-mcp, unmodified code, feature_toggles.json replaced)"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The upstream image is built from ./qradar-mcp with IBM's own Dockerfile, into an OCI
      # layout that the final build reads as its named context `upstream`. A layout, not
      # docker-image://, because the docker-container builder cannot see the runner's local
      # images. Provenance and SBOM stay off: an attestation manifest would sit in the
      # layout's index beside the image.
      - name: Build the upstream qradar-mcp
        if: matrix.name == 'qradar-mcp'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: qradar-mcp
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/qradar-mcp-upstream.tar

      - name: Unpack the upstream qradar-mcp layout
        if: matrix.name == 'qradar-mcp'
        run: |
          mkdir "$GITHUB_WORKSPACE/.qradar-mcp-upstream"
          tar -xf "$RUNNER_TEMP/qradar-mcp-upstream.tar" -C "$GITHUB_WORKSPACE/.qradar-mcp-upstream"
          test -s "$GITHUB_WORKSPACE/.qradar-mcp-upstream/index.json"

      # The frontend bundle is checked before anything is pushed. The check image is
      # built locally (load: true) and never pushed.
      - name: Build the frontend for the bundle check
        if: matrix.name == 'frontend'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: qradar-dash-check/frontend:check
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            APP_VERSION=${{ env.VERSION }}
            GIT_SHA=${{ github.sha }}
          labels: ${{ steps.labels.outputs.labels }}

      - name: The frontend bundle holds the relative API base and no localhost URL
        if: matrix.name == 'frontend'
        run: |
          docker run --rm --entrypoint sh qradar-dash-check/frontend:check -c '
            cd /app/.next
            grep -rqF "/api/v1" . || { echo "bundle lacks /api/v1" >&2; exit 1; }
            if grep -rF "http://localhost:8000/api/v1" . ; then
              echo "bundle contains http://localhost:8000/api/v1" >&2; exit 1
            fi
          '

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ format(matrix.build-contexts, github.workspace) }}
          push: true
          tags: ${{ steps.names.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            APP_VERSION=${{ env.VERSION }}
            GIT_SHA=${{ github.sha }}
          labels: ${{ steps.labels.outputs.labels }}

  redis:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: The pinned digests still resolve
        run: |
          # Redis is not built from a Dockerfile here; its pin lives in the
          # production compose file.
          redis="$(grep -oE 'redis:7\.4-alpine@sha256:[0-9a-f]{64}' docker-compose.prod.yml | sort -u)"
          [ "$(echo "$redis" | wc -l)" = "1" ] && [ -n "$redis" ] || { echo "expected exactly one pinned Redis reference" >&2; exit 1; }
          refs="$redis"
          # Every image the release builds from is digest-pinned in its
          # Dockerfile, and the secrets helper that touches the token and the
          # TLS key is pinned in deploy/load-secrets.sh (docs/DEVELOPMENT.md
          # "Base image pins"). A pin that no longer resolves fails the release
          # instead of silently building from whatever the bare tag points at
          # today. None of the references contains a space.
          for dockerfile in backend/Dockerfile frontend/Dockerfile \
            deploy/postgres/Dockerfile deploy/proxy/Dockerfile; do
            bases="$(grep -hoE '^ *FROM +[^ ]+@sha256:[0-9a-f]{64}' "$dockerfile" | sort -u | awk '{print $2}')"
            [ -n "$bases" ] || { echo "$dockerfile pins no base image by digest" >&2; exit 1; }
            refs="$refs $bases"
          done
          helper="$(sed -n 's/^SECRETS_HELPER_IMAGE=\([^[:space:]]*\)[[:space:]]*$/\1/p' deploy/load-secrets.sh | head -n1)"
          [[ "$helper" =~ ^alpine:[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]] \
            || { echo "deploy/load-secrets.sh has no digest-pinned SECRETS_HELPER_IMAGE" >&2; exit 1; }
          refs="$refs $helper"
          for ref in $refs; do
            echo "checking $ref"
            docker buildx imagetools inspect "$ref"
          done

  release:
    needs: [verify, images, redis]
    # This job writes the GitHub Release; it is the only one that needs
    # contents: write.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # The body is the release notes without their front matter.
          awk 'NR==1 && $0=="---" {fm=1; next} fm && $0=="---" {fm=0; next} !fm' \
            "docs/releases/$VERSION.md" > release-body.md
          gh release create "$GITHUB_REF_NAME" --title "$VERSION" --notes-file release-body.md --verify-tag
