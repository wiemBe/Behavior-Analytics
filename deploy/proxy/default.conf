# TLS terminates here. /api/ goes to the backend, everything else to the UI.
# No add_header and no proxy_hide_header: the security headers come from the
# backend middleware and this proxy must neither override nor hide them.

# Docker's embedded DNS. Upstreams are looked up per request, so a recreated
# backend or frontend container is found again without restarting the proxy.
resolver 127.0.0.11 valid=10s ipv6=off;

# Health probe for the container healthcheck. Loopback only, plain HTTP.
server {
    listen 127.0.0.1:8081;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A variable in proxy_pass with no URI part sends the request path through
    # unchanged, so /api/v1/... reaches the backend's own prefix.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
    }
}
